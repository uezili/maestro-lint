# ============================================================
# Teste de validação de valores permitidos (allowedValues)
# Cobre: Header, Comandos e When
# ============================================================

appId: com.test.app
tags:
  - smoke
  - wip
name: '[TEST-ALLOWED-VALUES] - Validação de valores restritos'

# ── Header: androidWebViewHierarchy ──────────────────────────
# ✅ CORRETO: único valor aceito é "devtools"
# androidWebViewHierarchy: devtools

# ❌ ERRO ESPERADO: valor inválido no header
androidWebViewHierarchy: chromium

---

# ══════════════════════════════════════════════════════════════
# COMANDOS COM allowedValues
# ══════════════════════════════════════════════════════════════

# ── setOrientation ───────────────────────────────────────────
# ✅ CORRETO: valores aceitos
- setOrientation: PORTRAIT
- setOrientation: LANDSCAPE_LEFT
- setOrientation: LANDSCAPE_RIGHT
- setOrientation: UPSIDE_DOWN

# ❌ ERRO ESPERADO: valores inválidos
- setOrientation: DIAGONAL
- setOrientation: landscape_left
- setOrientation: horizontal
- setOrientation: portrait

# ══════════════════════════════════════════════════════════════
# WHEN: validação de platform via WHEN_PROPERTY_SCHEMA
# ══════════════════════════════════════════════════════════════

# ✅ CORRETO: plataformas válidas
- tapOn:
    text: 'Botão Android'
    when:
      platform: android
- tapOn:
    text: 'Botão iOS'
    when:
      platform: ios
- tapOn:
    text: 'Botão Web'
    when:
      platform: web

# ❌ ERRO ESPERADO: plataformas inválidas
- tapOn:
    text: 'Botão Windows'
    when:
      platform: windows
- tapOn:
    text: 'Botão Desktop'
    when:
      platform: desktop
- assertVisible:
    text: 'Elemento Mobile'
    when:
      platform: mobile

# ══════════════════════════════════════════════════════════════
# OUTROS VALIDADORES (regressão)
# ══════════════════════════════════════════════════════════════

# ── Comando inválido (typo) ──────────────────────────────────
# ❌ ERRO ESPERADO: comando não existe
- setOrientaton: PORTRAIT

# ── Propriedade inválida em comando ──────────────────────────
# ❌ ERRO ESPERADO: "txt" não é prop válida de tapOn
- tapOn:
    txt: 'Valor errado'

# ── Valor vazio em comando que requer valor ──────────────────
# ❌ ERRO ESPERADO: inputText requer valor
- inputText:

# ── Case-sensitivity em comando ──────────────────────────────
# ❌ ERRO ESPERADO: capitalização errada
- setorientation: PORTRAIT
- Tapон: 'Login'

# ── Propriedade inválida no when ─────────────────────────────
# ❌ ERRO ESPERADO: "visibl" não é prop válida de when
- runFlow:
    file: 'outro-flow.yaml'
    when:
      visibl: '.*Texto.*'

# ── setPermissions (nested object) ───────────────────────────
# ✅ CORRETO
- setPermissions:
    permissions:
      camera: allow
      notifications: deny

# ❌ ERRO ESPERADO: chave e valor inválidos
- setPermissions:
    permissions:
      wifi: allow
      camera: granted

# ══════════════════════════════════════════════════════════════
# CHECKLIST DE ERROS ESPERADOS
# ══════════════════════════════════════════════════════════════
# Header:
#   1. androidWebViewHierarchy: chromium          → header.invalidValue
#
# Comandos (setOrientation):
#   2. setOrientation: DIAGONAL                   → command.invalidValue
#   3. setOrientation: landscape_left             → command.invalidValue
#   4. setOrientation: horizontal                 → command.invalidValue
#   5. setOrientation: portrait                   → command.invalidValue
#
# When (platform):
#   6. platform: windows                          → when.invalidValue
#   7. platform: desktop                          → when.invalidValue
#   8. platform: mobile                           → when.invalidValue
#
# Outros:
#   9. setOrientaton: PORTRAIT                    → command.invalidCommand (typo)
#  10. tapOn: txt                                 → command.invalidProperty
#  11. inputText: (vazio)                         → command.missingValue + emptyValue
#  12. setorientation: PORTRAIT                   → command.caseSensitivity
#  13. when: visibl                               → when.invalidProperty
#  14. setPermissions: wifi + granted             → nestedObject errors
# ══════════════════════════════════════════════════════════════
