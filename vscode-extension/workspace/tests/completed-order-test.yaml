appId: com.saucelabs.mydemoapp.rn

env:
  productName: "Sauce Labs Bike Light"
---
- runFlow: elements/load_elements.yaml
- runScript: scripts/factory_data.js
- runScript: auth.js

- launchApp:
    clearState: true

- runFlow:
    file: subflows/cart.yaml
    env:
      productName: ${productName}

- tapOn: ${output.cart.cartBadgeBtn}

- assertVisible: ${output.cart.myCartTitle}

- tapOn: ${output.cart.checkoutBtn}

- runFlow:
    file: subflows/login.yaml
    env:
      username: ${output.helper.env.USERNAME}
      password: ${output.helper.env.PASSWORD}

- runFlow:
    file: subflows/checkout_address.yaml
    env:
      fullName: ${output.RANDOM_FULLNAME}
      address_line: ${output.RANDOM_ADDRESS_LINE}
      city: ${output.RANDOM_CITY}
      state: ${output.RANDOM_STATE}
      zip_code: ${output.RANDOM_ZIP_CODE}
      country: ${output.RANDOM_COUNTRY}

- runFlow:
    file: subflows/checkout_payments.yaml
    env:
      fullName: ${output.RANDOM_FULLNAME}
      card_number: ${output.CARD_NUMBER}
      expiration_date: ${output.EXPIRATION_DATE}
      security_code: ${output.SECURITY_CODE}

- assertVisible: ${output.price}

- runFlow:
    file: subflows/checkout_review.yaml

- runScript:
    file: scripts/concat_string.js
    env:
      city: ${output.RANDOM_CITY}
      state: ${output.RANDOM_STATE}
      zip_code: ${output.RANDOM_ZIP_CODE}
      country: ${output.RANDOM_COUNTRY}
      expiration_date: ${output.EXPIRATION_DATE}

- assertVisible: ${output.RANDOM_FULLNAME}
- assertVisible: ${output.RANDOM_ADDRESS_LINE}
- assertVisible: ${output.CARD_NUMBER}
- assertVisible: ${output.expirationDateValidation}
- assertVisible: ${output.zipCodeAndCountryValidation}
- assertVisible: ${output.cityAndStateValidation}

- tapOn: ${output.checkoutReview.placeOrderBtn}

- assertVisible: ${output.checkoutReview.checkoutCompleteText}
